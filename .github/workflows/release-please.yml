name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          # develop est la branche par défaut du dépôt, les releases se font sur main
          target-branch: main
          release-type: node
          manifest-file: .release-please-manifest.json
