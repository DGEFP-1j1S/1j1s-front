name: Simulation de déploiement Terraform

# Exécute le plan uniquement quand des modifications sont apportées
# - aux fichiers Terraform
# - aux variables d'environnement
# dans une pull request
on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'
      - '.env.scalingo'

jobs:
  # Le "plan" s'éxécute toujours sur la recette : l'environnement scalingo-production
  # n'est accessible qu'à main, pas aux refs de pull request (refs/pull/N/merge).
  # Le plan de production est affiché par mise-en-production.yml juste avant l'apply.
  terraform_plan:
    uses: ./.github/workflows/terraform-template.yml
    secrets: inherit
    with:
      plan: true
      environnement_name: scalingo-recette
      environnement_url: https://recette.1jeune1solution.gouv.fr
